[project]
name = "subagent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.23.0",
    "agent-framework-openai>=1.17.0",
    "agent-framework-orchestrations>=1.4.0",
    "chess>=1.11.2",
    "deepagents>=0.7.32",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.4",
    "smolagents>=1.26.0",
    "tavily-python>=0.8.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "legacy_scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [
    ".venv",
    "legacy_scripts",
]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Top-level event generators must catch Exception to yield structured SSE error events
    "S110",    # Handled pass in cancellation cleanups and fallback searches
]




